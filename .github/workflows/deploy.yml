name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/marte-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/marte-frontend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/systems/marte-mining/web-mining

            echo "📦 Guardando imagen actual..."
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' web-mining-frontend-1 || echo "none")

            echo "⬇️ Pull nueva imagen..."
            docker compose pull frontend

            echo "🚀 Deploy nueva versión..."
            docker compose up -d frontend

            echo "⏳ Esperando healthcheck..."
            sleep 10

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' web-mining-frontend-1 || echo "starting")

            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Falló deploy. Haciendo rollback..."

              if [ "$CURRENT_IMAGE" != "none" ]; then
                docker run -d -p 80:80 $CURRENT_IMAGE
              fi
            else
              echo "✅ Deploy exitoso"
            fi
