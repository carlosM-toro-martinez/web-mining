name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            VITE_API_BASE_URL=https://api.marte.encuentrass.lat
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/marte-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/marte-frontend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /root/systems/marte-mining/web-mining

            echo "Sincronizando repo remoto (forzando estado de main)..."
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            echo "Versión actual:"
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' web-mining-frontend-1 2>/dev/null || true)
            CURRENT_VERSION=""
            if [ -n "${CURRENT_IMAGE:-}" ] && [[ "$CURRENT_IMAGE" == *":"* ]]; then
              CURRENT_VERSION="${CURRENT_IMAGE##*:}"
            fi
            if [ -z "${CURRENT_VERSION:-}" ]; then
              CURRENT_VERSION="none"
            fi
            echo "$CURRENT_VERSION"

            echo "Nueva versión: ${{ github.sha }}"

            export VERSION=${{ github.sha }}

            echo "Pull nueva imagen..."
            docker compose pull frontend

            echo "Deploy nueva versión..."
            docker compose up -d

            echo "Esperando healthcheck..."
            ATTEMPTS=18
            STATUS="starting"
            for i in $(seq 1 $ATTEMPTS); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' web-mining-frontend-1 2>/dev/null || echo "starting")
              echo "Healthcheck intento $i/$ATTEMPTS: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "Falló deploy. Rollback..."

              if [ "$CURRENT_VERSION" != "none" ] && [ -n "${CURRENT_VERSION:-}" ]; then
                export VERSION=$CURRENT_VERSION

                echo "Volviendo a versión anterior: $VERSION"
                docker compose pull frontend
                docker compose up -d
              else
                echo "No hay versión anterior"
              fi
              exit 1
            else
              echo "Deploy exitoso"
            fi
